<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSS Opportunity Radar — Find Open-Source Commercialization Opportunities</title>
  <meta name="description" content="从 GitHub 数据自动发现“用户需求很强但还没人做好商业化”的开源机会。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>📡 OSS Opportunity Radar</h1>
      <p class="tagline">开源商业化机会雷达 —— 从 GitHub 数据发现“有人需要、还没人做好商业化”的开源方向</p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <nav id="topics" class="topics" aria-label="Topics"></nav>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search repos / description…" autocomplete="off" />
        <select id="sort" aria-label="Sort"><option value="score">By score</option><option value="stars">By stars</option><option value="issues">By issues</option><option value="name">By name</option></select>
        <label class="slider-label">Min score <output id="minScoreOut">0</output><input id="minScore" type="range" min="0" max="100" step="5" value="0" /></label>
        <button id="savedToggle" class="btn" type="button">⭐ Saved (<span id="savedCount">0</span>)</button>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Score = Popularity(20) + Demand(15) + Activity(10) + Health(15) + Commercialization gap(40, may be negative) ｜ core signal = is there already a hosted / cloud / priced product</p>
      <p id="meta"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
